name: Generate Today's Edition
on:
  schedule:
    # 00:10 UTC, right after the UTC date rolls over, so the first readers of
    # the day get a pre-printed edition instead of waiting for generation.
    - cron: "10 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Set a repository variable SITE_URL to the canonical deployment URL.
      SITE_URL: ${{ vars.SITE_URL || 'https://sa-the-silicon-gazette.vercel.app' }}
    steps:
      - name: Compute today's edition date (UTC)
        id: edition_date
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Trigger edition generation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DATE="${{ steps.edition_date.outputs.date }}"
          # --fail-with-body prints the API's error message in the run log.
          # Retries are spaced out and capped: each one is a full paid run that
          # counts against the daily generation budget.
          curl --fail-with-body --show-error --location --retry 2 --retry-delay 60 --max-time 320 \
            -X POST "${SITE_URL}/api/gazette/generate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "{\"date\":\"$DATE\"}"
      # Fails the run (and GitHub emails the repo owner) if the site is down or
      # today's edition still isn't live.
      - name: Verify the edition is live
        run: |
          curl --fail --show-error --location --retry 3 --retry-delay 20 --max-time 30 "${SITE_URL}/api/health"
