name: Generate Today's Edition
on:
  schedule:
    # 00:10 UTC, right after the UTC date rolls over, so the first readers of
    # the day get a pre-printed edition instead of waiting for generation.
    - cron: "10 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Compute today's edition date (UTC)
        id: edition_date
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Trigger edition generation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          DATE="${{ steps.edition_date.outputs.date }}"
          curl --fail --show-error --retry 3 --retry-delay 30 --max-time 320 \
            -X POST "https://the-silicon-gazette.vercel.app/api/gazette/generate" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "{\"date\":\"$DATE\"}"
